name: $(SourceBranchName)_$(date:yyyyMMdd)$(rev:.r)

trigger:
- main

pool:
  vmImage: ubuntu-latest

parameters:
  - name: publishPackage
    displayName: Publish Package to Nuget Library
    type: boolean
    default: false

variables:
  solution: '**/*.sln'
  buildPlatform: Any CPU
  buildConfiguration: Release

steps:
- task: UseDotNet@2
  inputs:
    version: 8.0.x

- task: NuGetToolInstaller@1
  displayName: Nuget Install

- task: NuGetAuthenticate@1
  displayName: Nuget Authentication

- task: DotNetCoreCLI@2
  displayName: Dotnet Restore
  inputs:
    command: restore
    projects: '**/*.sln'
   
- task: DotNetCoreCLI@2
  displayName: Dotnet Build
  inputs:
    command: build
    projects: '**/*.csproj'
    workingDirectory: $(Build.SourcesDirectory)

- task: DockerCompose@1
  displayName: Docker Compose Up
  inputs:
    containerRegistryType: Container Registry
    dockerComposeFile: $(Build.SourcesDirectory)/.build/compose.yml
    action: Run services
    detached: true
    arguments: --force-recreate mongosetup
    projectName: "mongo-repository"
  
- task: DotNetCoreCLI@2
  displayName: Dotnet Test
  inputs:
    command: test
    projects: Mongo.Repository.Tests/Mongo.Repository.Tests.csproj

- task: DockerCompose@1
  condition: always()
  displayName: Docker Compose Down
  inputs:
    containerregistrytype: Container Registry
    dockerComposeFile: $(Build.SourcesDirectory)/.build/compose.yml
    action: Run a Docker Compose command
    dockerComposeCommand: down

- task: DotNetCoreCLI@2
  displayName: Nuget Pack
  inputs:
    command: pack
    packagesToPack: Mongo.Repository/Mongo.Repository.csproj
    versioningScheme: off

- task: NuGetCommand@2
  displayName: Nuget Push
  condition: eq(${{ parameters.publishPackage }}, true)
  inputs:
    command: push
    packagesToPush: $(Build.ArtifactStagingDirectory)/**/*.nupkg;!$(Build.ArtifactStagingDirectory)/**/*.symbols.nupkg
    nuGetFeedType: external
    publishFeedCredentials: Nuget
